apiVersion: 1

datasources:
  - name: TestData DB
    type: testdata
    uid: trlxrdZVk
    isDefault: true

  # VictoriaMetrics from docker-compose.yaml. Incremental querying is off, like production.
  - name: VictoriaMetrics (local)
    type: prometheus
    uid: glide-vm
    access: proxy
    url: http://victoriametrics:8428
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 1s
      incrementalQuerying: false
